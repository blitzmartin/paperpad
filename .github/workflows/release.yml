# Builds PaperPad for Windows, macOS (Apple Silicon and Intel) and Linux.
#
# - Publish a release on GitHub (Releases > Draft a new release > Publish)
#   -> builds every platform and uploads the installers to THAT release.
#   Saving a release as draft does not trigger anything: GitHub never fires
#   workflow events for drafts. The run starts when you press Publish.
# - Run it manually (Actions tab > Release > Run workflow) -> builds only and
#   attaches the installers to the run as downloadable artifacts.
#
# The release tag must be "v" + "version" in src-tauri/tauri.conf.json
# (e.g. v1.0.0 for 1.0.0). The verify job fails fast if they differ.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; only the build job may write releases.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs once (not per platform) so a tag/version mismatch fails in seconds
  # instead of after four full builds.
  verify:
    name: Verify tag matches app version
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare release tag with tauri.conf.json version
        if: github.event_name == 'release'
        # The tag goes through env, never interpolated into the script,
        # so a crafted tag name cannot inject shell code.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match app version 'v$VERSION'. Bump the version or retag."
            exit 1
          fi
          echo "Tag $TAG matches app version $VERSION"

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build and (on release) upload installers to the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Upload into the release that triggered this run. Title, notes and
          # prerelease flag stay whatever you set in the GitHub UI.
          # Empty on manual runs, which means "build only, upload nothing".
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}

      - name: Upload installers as workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: PaperPad-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
